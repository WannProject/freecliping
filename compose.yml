name: freecliping

services:
  mysql:
    image: mysql:8.4
    container_name: freecliping-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_DATABASE:-freecliping}"
      MYSQL_USER: "${DB_USERNAME:-freecliping}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-freecliping}"
    volumes:
      - freecliping-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: freecliping-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - freecliping-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  freecliping-mysql:
  freecliping-redis:
